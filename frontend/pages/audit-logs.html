<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Log</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Audit Log</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="/pages/dashboard.html">Dashboard</a>
        <a href="/pages/reports.html">Reports</a>
      </nav>
      <section class="card">
        <button id="refresh-audit-logs" type="button">Refresh</button>
        <p id="audit-message" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>Date</th><th>User</th><th>Role</th><th>Action</th><th>Module</th><th>Details</th></tr>
            </thead>
            <tbody id="audit-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/audit-logs.js"></script>
  </body>
</html>
