<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediLink Medication Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <h1 style="margin-top:0;">Hospital Patient Medication</h1>
      <p style="color:#788395;">Sign in to continue</p>
      <form id="login-form">
        <label>
          Username or Email
          <input id="username" name="username" type="text" placeholder="e.g. nurse1" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" placeholder="Enter password" required />
        </label>
        <div class="row">
          <button type="button" class="secondary" id="toggle-password">Show</button>
          <button type="submit">Login</button>
        </div>
      </form>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
