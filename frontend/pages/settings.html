<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facility Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Facility Settings</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="/pages/dashboard.html">Dashboard</a>
        <a href="/pages/reports.html">Reports</a>
      </nav>
      <section class="card">
        <p id="settings-message" role="status" aria-live="polite"></p>
        <form id="settings-form" hidden>
          <label>Hospital name <input id="setting-hospital-name" maxlength="200" /></label>
          <label>Contact information <input id="setting-contact-info" maxlength="500" /></label>
          <label>Facility timezone preference <input id="setting-timezone" placeholder="Asia/Manila" maxlength="100" /></label>
          <p>Server date calculations use the server's <code>TZ</code> environment setting.</p>
          <label>Dose reminder (minutes before scheduled time; use 0 for at-time reminders) <input id="setting-dose-reminder-lead" type="number" min="0" max="1440" step="1" /></label>
          <label>Delay warning (minutes after scheduled time) <input id="setting-delay-threshold" type="number" min="0" step="1" /></label>
          <label>Unrecorded-dose review (minutes after scheduled time) <input id="setting-missed-threshold" type="number" min="0" step="1" /></label>
          <p>The dose reminder defaults to the scheduled time. Delay and unrecorded-dose warnings default to 30 and 120 minutes. Reminders do not change administration records or mark doses missed.</p>
          <button type="submit">Save settings</button>
        </form>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/settings.js"></script>
  </body>
</html>
